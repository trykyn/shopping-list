<title>장보기</title>
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1f2623; --muted: #6d7772; --line: #e3e1da;
  --accent: #2f7d5b; --accent-ink: #ffffff; --soft: #e6f1eb;
  --warn: #b7791f; --warn-bg: #fdf3dc; --bad: #b3372f; --bad-bg: #fbe6e3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151917; --card: #1f2522; --ink: #ecefed; --muted: #98a39d; --line: #303834;
    --accent: #5fbf93; --accent-ink: #10231a; --soft: #24352d;
    --warn: #e5b45a; --warn-bg: #3a2f17; --bad: #f08a80; --bad-bg: #3d211e;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 64px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 22px; margin: 0; }
h2 { font-size: 16px; margin: 20px 2px 8px; }
h2 .n { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
.hint { color: var(--muted); font-size: 14px; margin: -4px 2px 8px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--card); }
.lang button { padding: 6px 12px; font-size: 14px; color: var(--muted); }
.lang button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; padding: 8px 14px; border-radius: 999px; background: var(--card);
  border: 1px solid var(--line); white-space: nowrap; font-size: 15px;
}
.tab.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tab .n { opacity: .75; font-size: 13px; margin-left: 4px; }
.tab.stock { border-style: dashed; }
.tab.stock.on { border-style: solid; }
.banner {
  background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px;
  margin-bottom: 12px; font-size: 15px; width: 100%; text-align: left; display: block;
}
[hidden] { display: none !important; }
.search { position: relative; margin-bottom: 4px; }
.search input {
  width: 100%; padding: 11px 40px 11px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  font-size: 16px; -webkit-appearance: none; appearance: none;
}
.search input::-webkit-search-cancel-button { display: none; }
.search .x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.add { display: flex; gap: 8px; margin-bottom: 12px; }
.add input {
  flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
}
.add button, .btn {
  padding: 0 16px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 600; min-height: 44px;
}
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
li:first-child { border-top: 0; }
.pick { flex: 1; min-width: 0; min-height: 32px; text-align: left; padding: 0; }
.note { font-size: 13px; color: var(--accent); background: var(--soft); border-radius: 6px; padding: 1px 7px; margin-left: 6px; white-space: nowrap; }
.move input { flex: 1 1 130px; min-width: 0; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
li input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.name { overflow-wrap: anywhere; }
.alt { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 6px; }
.x { color: var(--muted); padding: 6px 8px; font-size: 18px; line-height: 1; border-radius: 8px; }
.x:hover { background: var(--soft); }
li { flex-wrap: wrap; }
.move { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); padding: 0 0 4px 34px; }
.empty { color: var(--muted); text-align: center; padding: 36px 12px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.link { color: var(--muted); font-size: 14px; text-decoration: underline; padding: 6px 2px; }
.s-item { display: block; }
.s-item { padding: 0 12px; }
.s-top { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 0; min-height: 44px; }
.s-top .name { flex: 1; min-width: 0; }
.chev { color: var(--muted); font-size: 12px; }
.s-item .seg { margin-bottom: 10px; }
.s-item .s-row { margin: 0 0 12px; }
.badge { flex: none; font-size: 13px; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--accent); font-weight: 600; }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.none { background: transparent; color: var(--muted); font-weight: 400; }
.s-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; margin-top: 8px; }
.s-row label { display: flex; align-items: center; gap: 6px; flex: none; white-space: nowrap; min-height: 0; }
.s-row .chip { white-space: nowrap; }
.s-row input[type=date] { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 14px; }
.seg button { flex: 1; padding: 7px 6px; white-space: nowrap; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button:hover { background: var(--soft); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip { padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 14px; }
.chip:hover { background: var(--soft); }
.sp { flex: 1; }
.cloud { margin-top: 28px; padding: 14px; border: 1px dashed var(--line); border-radius: 14px; font-size: 14px; color: var(--muted); }
.shared { margin-top: 28px; text-align: center; }
.shared + .shared { margin-top: 0; }
.shared summary { display: inline-block; list-style: none; cursor: pointer; color: var(--muted); font-size: 13px; padding: 8px; }
.shared summary::-webkit-details-marker { display: none; }
.shared .cloud { margin-top: 6px; text-align: left; }
.cloud p { margin: 0 0 10px; }
.cloud .foot { margin-top: 0; align-items: center; }
.code { color: var(--ink); letter-spacing: 1px; user-select: all; }

for (const c of WORDS) for (const lang of ['ko', 'de']) for (const k of c[lang]) {
  const key = k.toLowerCase();
  if (!key.endsWith('*') && !LOOKUP.has(key)) LOOKUP.set(key, { c, lang });
}

// Lateinische Schlüssel treffen ein Wort oder dessen Ende ("vollmilch" → milch), mit * den Anfang;
// koreanische als Teilwort (einzelne Silben nur als ganzes Wort). Der längste Treffer gewinnt.
function guessDays(name) {
  const n = name.toLowerCase().trim();
  const tokens = n.split(/[^\p{L}]+/u).filter(Boolean);
  let best = null;
  for (const c of WORDS) for (let k of c.keys) {
    let hit;
    if (/^[a-zäöüß*]+$/.test(k)) {
      if (k.endsWith('*')) { k = k.slice(0, -1); hit = tokens.some(t => t.startsWith(k)); }
      else hit = tokens.some(t => t === k || (k.length >= 4 && t.endsWith(k)));
    } else hit = k.length === 1 ? tokens.includes(k) : n.includes(k);
    if (hit && (!best || k.length > best.len)) best = { d: c.d, len: k.length };
  }
  return best && best.d ? best.d : null;
}

// Zeigt einen Namen in der gewählten Sprache, egal in welcher er eingegeben wurde.
// Unbekannte Wörter bleiben, wie sie sind. / 입력한 언어와 상관없이 선택한 언어로 표시. 모르는 단어는 그대로.
function tr(name, lang = S.lang) {
  const one = s => {
    s = s.toLowerCase();
    let e = LOOKUP.get(s);
    // Deutsche Zusammensetzung: am Wortende suchen ("Vollmilch" → Milch) / 독일어 합성어는 끝부분으로 찾기
    if (!e && /^[a-zäöüß]+$/.test(s)) for (let i = 1; i <= s.length - 4 && !e; i++) e = LOOKUP.get(s.slice(i));
    return e && e.lang !== lang ? e.c[lang][0] : null;
  };
  const n = clean(name);
  // Selbst korrigierte Übersetzung geht vor / 직접 고친 번역이 먼저
  const f = (S.fix || []).find(f => f.id === fixId(n));
  if (f) return srcLang(n) !== lang ? f.to : n;
  const r = one(n) || one(n.replace(/ /g, '')) || n.split(' ').map(w => one(w) || w).join(' ');
  if (r !== n) return r;
  // Nicht im Wörterbuch: gespeicherte Online-Übersetzung / 사전에 없으면 저장해 둔 온라인 번역
  const c = S.tx && S.tx[n];
  return c && srcLang(n) !== lang ? c : n;
}

// ---------- Online-Übersetzung / 온라인 번역 ----------
// Was das Wörterbuch nicht kennt, übersetzt MyMemory (kostenlos, ohne Konto); das Ergebnis wird gespeichert,
// damit jedes Wort nur einmal gesendet wird. / 사전에 없는 단어는 MyMemory(무료, 계정 불필요)로 번역하고,
// 결과를 저장해서 단어마다 한 번만 전송.
const clean = s => s.trim().replace(/\s+/g, ' ');
const srcLang = s => /[ㄱ-ㆎ가-힣]/.test(s) ? 'ko' : 'de';
const asked = new Set();
// Schlüssel einer korrigierten Übersetzung: der eingegebene Name als Zeichencodes / 고친 번역의 열쇠: 입력한 이름의 문자 코드
const fixId = n => 'f' + [...n.toLowerCase()].map(c => c.codePointAt(0).toString(36)).join('_');
function translateOnline(name) {
  const n = clean(name), from = srcLang(n), to = from === 'ko' ? 'de' : 'ko';
  if (!/\p{L}/u.test(n) || asked.has(n) || (S.tx && S.tx[n]) || tr(n, to) !== n) return;
  asked.add(n);
  fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(n)}&langpair=${from}|${to}`)
    .then(r => r.json())
    .then(j => {
      const out = clean((j.responseData && j.responseData.translatedText) || '');
      if (j.responseStatus != 200 || !out || out.toLowerCase() === n.toLowerCase() || /MYMEMORY WARNING/i.test(out)) return;
      (S.tx = S.tx || {})[n] = out;
      // Haltbarkeit nachtragen, wenn erst die Übersetzung das Lebensmittel erkennen lässt
      // 번역으로 비로소 식품을 알아본 경우 소비기한 채우기
      for (const x of S.stock) if (clean(x.name) === n && !x.days && !x.manual) {
        x.days = guessDays(out);
        if (x.days) x.expires = addDays(x.bought, shelfDays(x));
      }
      save(); render(); checkExpiry();
    })
    .catch(() => asked.delete(n));
}
// Name in der gewählten Sprache, dahinter klein die andere / 선택한 언어 이름 + 옆에 작게 다른 언어
function nameHtml(name) {
  const a = tr(name), b = tr(name, S.lang === 'ko' ? 'de' : 'ko');
  return esc(a) + (b !== a ? ` <span class="alt">${esc(b)}</span>` : '');
}

// ---------- Zustand / 상태 ----------
const KEY = 'shopping-list-v1';
const LOCS = ['fridge', 'freezer', 'pantry'];
const ICON = { fridge: '🧊', freezer: '❄️', pantry: '🧺' };
const FROZEN_DAYS = 90;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let S = load();
// memo: Artikelnamen, die zuletzt im Vorrat lagen / 지난번에 실온에 둔 물건 이름
S.memo = S.memo || [];
// fix: von Hand korrigierte Übersetzungen { id, to } / 직접 고친 번역
S.fix = S.fix || [];
// Schlüssel dafür: der Name auf Deutsch, als Zeichencodes (taugt als Feldname in der geteilten Liste).
// 그 열쇠: 독일어 이름을 문자 코드로 바꾼 것(공유 목록의 필드 이름으로 쓸 수 있게).
const memoId = name => 'n' + [...tr(name, 'de').toLowerCase()].map(c => c.codePointAt(0).toString(36)).join('_');

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.stores) return s; } catch (e) {}
  return {
    lang: (navigator.language || '').startsWith('de') ? 'de' : 'ko',
    stores: [{ id: 'super', key: 'super' }, { id: 'asia', key: 'asia' }, { id: 'online', key: 'online' }],
    items: [], stock: [], active: 'super',
  };
}
// Speichert auf dem Gerät und schickt Änderungen an die geteilte Liste, falls verbunden.
// 기기에 저장하고, 연결돼 있으면 바뀐 내용을 공유 목록으로 보냄.
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (window.cloud) window.cloud.push();
}

const t = () => T[S.lang];
const storeName = s => s.key ? t()[s.key] : tr(s.name);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ---------- Datum / 날짜 ----------
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const daysLeft = s => Math.round((parse(s) - parse(iso(new Date()))) / 864e5);
// Geschätzte Haltbarkeit am aktuellen Lagerort: im Gefrierfach mindestens 90 Tage.
// 지금 보관 장소 기준 추정 보관 기간: 냉동고에서는 최소 90일.
const shelfDays = x => x.days && (x.loc === 'freezer' ? Math.max(x.days, FROZEN_DAYS) : x.days);
// Vorwarnzeit: 7 Tage; bei kurz Haltbarem (≤ 10 Tage) 2 Tage, sonst käme die Meldung direkt beim Kauf.
// 알림 시점: 7일 전. 보관 기간이 짧은 것(10일 이하)은 사자마자 울리지 않도록 2일 전.
const lead = x => parse(x.expires) - parse(x.bought) <= 10 * 864e5 ? 2 : 7;
const soon = x => x.expires && daysLeft(x.expires) <= lead(x);

// ---------- Anzeige / 화면 ----------
function render() {
  const L = t();
  document.documentElement.lang = S.lang;
  document.title = L.title;
  if (S.active !== 'stock' && !S.stores.some(s => s.id === S.active)) S.active = S.stores[0] ? S.stores[0].id : 'stock';
  const due = S.stock.filter(soon).length;

  let h = `<header><h1>🛒 ${L.title}</h1><div class="lang">
    <button data-act="lang" data-v="ko" class="${S.lang === 'ko' ? 'on' : ''}">한국어</button>
    <button data-act="lang" data-v="de" class="${S.lang === 'de' ? 'on' : ''}">Deutsch</button></div></header>`;

  h += '<nav class="tabs">';
  h += `<button class="tab stock ${S.active === 'stock' ? 'on' : ''}" data-act="tab" data-v="stock">✓ ${L.stock}${S.stock.length ? `<span class="n">${S.stock.length}</span>` : ''}</button>`;
  for (const s of S.stores) {
    const n = S.items.filter(i => i.store === s.id).length;
    h += `<button class="tab ${S.active === s.id ? 'on' : ''}" data-act="tab" data-v="${s.id}">${esc(storeName(s))}${n ? `<span class="n">${n}</span>` : ''}</button>`;
  }
  h += `<button class="tab" data-act="addStore">${L.addStore}</button></nav>`;

  if (due && S.active !== 'stock') h += `<button class="banner" data-act="tab" data-v="stock">${L.banner(due)}</button>`;

  if (S.active === 'stock') h += renderStock(L, due);
  else {
    const items = S.items.filter(i => i.store === S.active);
    h += `<form class="add" data-act="add"><input name="name" placeholder="${L.addPh}" autocomplete="off" enterkeyhint="done"><button>${L.add}</button></form>`;
    h += items.length
      ? '<ul>' + items.map(i => `<li><input type="checkbox" data-act="buy" data-v="${i.id}" aria-label="${esc(tr(i.name))}">
          <button class="pick name" data-act="noteOpen" data-v="${i.id}" title="${L.note}">${nameHtml(i.name)}${noteHtml(i)}</button>
          ${S.stores.length > 1 ? `<button class="x" data-act="moveOpen" data-v="${i.id}" title="${L.move}" aria-label="${L.move}">⇄</button>` : ''}
          <button class="x" data-act="del" data-v="${i.id}" aria-label="×">×</button>
          ${moveId === i.id ? `<div class="move">${L.moveTo}${S.stores.filter(s => s.id !== i.store).map(s =>
            `<button class="chip" data-act="move" data-v="${i.id}:${s.id}">${esc(storeName(s))}</button>`).join('')}</div>` : ''}
          ${noteId === i.id ? editForm(i, L) : ''}</li>`).join('') + '</ul>'
      : `<p class="empty">${L.emptyList}</p>`;
  }
  h += cloudHtml(L);
  // Liste löschen liegt ganz unten hinter einem Aufklapper, damit man es nicht versehentlich trifft.
  // 목록 삭제는 실수로 누르지 않게 맨 아래 접힌 칸 안에.
  const cur = S.stores.find(s => s.id === S.active);
  if (cur) h += `<details class="shared manage"><summary>⚙ ${L.manage}</summary><div class="cloud">
    <button class="link" data-act="delStore">${L.delStore(esc(storeName(cur)))}</button></div></details>`;
  // Getippten Text und Fokus über das Neuzeichnen retten / 다시 그려도 입력 중인 글자와 포커스 유지
  const root = document.getElementById('app');
  const typing = [...root.querySelectorAll('input[name]')].map(el => [el.name, el.value, el === document.activeElement]);
  root.innerHTML = h;
  for (const [name, value, focused] of typing) {
    const el = root.querySelector(`input[name="${name}"]`);
    if (el && (value || focused)) el.value = value;
    if (el && focused) el.focus();
  }
  filterStock(); // Suchbegriff gilt auch nach dem Neuzeichnen / 다시 그려도 검색어 유지

  for (const x of [...S.items, ...S.stock, ...S.stores.filter(s => !s.key)]) translateOnline(x.name);
}

// Konto und geteilte Liste; ohne Firebase-Konfiguration bleibt die App rein lokal.
// 계정과 공유 목록. Firebase 설정이 없으면 앱은 기기 안에서만 동작.
function cloudHtml(L) {
  const c = window.cloud;
  if (!c || !c.ready) return '';
  if (!c.user) return `<div class="cloud"><p>${L.signHint}</p><button class="btn" data-act="signin">${L.signIn}</button></div>`;
  if (!S.house) return `<div class="cloud"><p>${L.houseHint}</p><div class="foot">
    <button class="btn" data-act="houseNew">${L.houseNew}</button>
    <button class="btn ghost" data-act="houseJoin">${L.houseJoin}</button>
    <span class="sp"></span><button class="link" data-act="signout">${L.signOut}</button></div></div>`;
  // Verbunden: nur eine kleine Zeile; Code und Abmelden erst nach Antippen.
  // 연결된 뒤에는 작은 한 줄만. 초대 코드와 로그아웃은 눌러야 보임.
  return `<details class="shared"><summary>👥 ${L.shared}</summary><div class="cloud">
    <p>${L.codeLabel} <b class="code">${esc(S.house)}</b></p><div class="foot">
    <button class="chip" data-act="copyCode">${L.copy}</button>
    <span class="sp"></span><button class="link" data-act="signout">${L.signOut}</button></div></div></details>`;
}

function renderStock(L, due) {
  let h = due ? `<div class="banner">${L.banner(due)}</div>` : '';
  if (!S.stock.length) return h + `<p class="empty">${esc(L.emptyStock).replace('\n', '<br>')}</p>`;
  // Suchfeld: filtert beim Tippen, ohne neu zu zeichnen (sonst bricht die koreanische Eingabe ab).
  // 검색 칸: 입력하는 대로 걸러 냄. 다시 그리지 않음 (다시 그리면 한글 조합이 끊김).
  h += `<div class="search"><input type="search" name="stockQ" data-search placeholder="${L.searchPh}" aria-label="${L.searchPh}"
    autocomplete="off" enterkeyhint="search"><button type="button" class="x" data-clear-search aria-label="${L.clear}" hidden>×</button></div>`;
  // Erst das noch nicht Eingeräumte, dann je Lagerort / 정리 전 물건 먼저, 그다음 보관 장소별
  for (const loc of [null, ...LOCS]) {
    const xs = S.stock.filter(x => (LOCS.includes(x.loc) ? x.loc : null) === loc)
      .sort((a, b) => (a.expires || '9999').localeCompare(b.expires || '9999'));
    if (!xs.length) continue;
    h += `<section class="stock-sec"><h2>${loc ? ICON[loc] + ' ' + L[loc] : L.unsorted}<span class="n">${xs.length}</span></h2>`;
    if (!loc) h += `<p class="hint">${L.unsortedHint}</p>`;
    h += '<ul>' + xs.map(x => stockItem(x, L)).join('') + '</ul></section>';
  }
  h += `<p class="empty" id="no-match" hidden>${L.noMatch}</p>`;
  if ('Notification' in window) {
    const p = Notification.permission;
    h += `<div class="foot">${p === 'granted' ? `<span class="link" style="text-decoration:none">${L.notifOk}</span>`
      : p === 'denied' ? `<span class="link" style="text-decoration:none">${L.notifNo}</span>`
      : `<button class="btn ghost" data-act="notif">${L.notifOn}</button>`}</div>`;
  }
  return h;
}

// Notiz und Übersetzung eines Artikels bearbeiten; das zweite Feld zeigt die Übersetzung in die andere Sprache.
// 메모와 번역 고치기. 둘째 칸은 다른 언어로 된 번역.
function editForm(x, L) {
  const n = clean(x.name), to = srcLang(n) === 'ko' ? 'de' : 'ko', t = tr(n, to);
  return `<form class="move" data-act="note" data-v="${x.id}"><input name="note_${x.id}" value="${esc(x.note || '')}" placeholder="${L.notePh}" maxlength="60" autocomplete="off" enterkeyhint="done">
    <input name="tx_${x.id}" value="${esc(t !== n ? t : '')}" placeholder="${L.txPh[to]}" maxlength="60" autocomplete="off" enterkeyhint="done"><button class="chip">${L.noteOk}</button></form>`;
}

function stockItem(x, L) {
  let badge = `<span class="badge none">${L.noDate}</span>`;
  if (x.expires) {
    const d = daysLeft(x.expires);
    badge = `<span class="badge ${d < 0 ? 'bad' : soon(x) ? 'warn' : ''}">${d < 0 ? L.over(-d) : d === 0 ? L.today : L.left(d)}</span>`;
  }
  // Eine Zeile pro Artikel; Antippen klappt die Bedienung auf. Noch nicht Eingeräumtes zeigt gleich die Lagerorte.
  // 물건마다 한 줄, 누르면 펼쳐짐. 정리 전 물건은 보관 장소 버튼을 바로 보여 줌.
  const open = x.id === openId, placed = LOCS.includes(x.loc);
  // Suchtext: Name in beiden Sprachen und Notiz / 검색용 글: 두 언어 이름과 메모
  const find = searchKey([x.name, tr(x.name, 'ko'), tr(x.name, 'de'), x.note || ''].join(' '));
  return `<li class="s-item" data-find="${esc(find)}"><button class="s-top" data-act="open" data-v="${x.id}" aria-expanded="${open}">
      <span class="name">${nameHtml(x.name)}${noteHtml(x)}</span>${badge}<span class="chev">${open ? '▴' : '▾'}</span></button>
    ${open || !placed ? `<div class="seg">${LOCS.map(l => `<button data-act="loc" data-v="${x.id}:${l}" class="${x.loc === l ? 'on' : ''}">${ICON[l]} ${L[l]}</button>`).join('')}</div>` : ''}
    ${open ? `${editForm(x, L)}
      <div class="s-row"><label>${L.exp} <input type="date" data-act="exp" data-v="${x.id}" value="${x.expires || ''}"></label>
      <span class="sp"></span>
      <button class="chip" data-act="again" data-v="${x.id}">↩ ${L.again}</button>
      <button class="chip" data-act="used" data-v="${x.id}">${L.used}</button></div>` : ''}</li>`;
}

// ---------- Suche in "Gekauft" / 구입한 것 검색 ----------
// Groß/klein und Leerzeichen egal: "Voll Milch" findet "Vollmilch", "두 부" findet "두부".
// 대소문자와 띄어쓰기 상관없이 찾기.
const searchKey = s => String(s).toLowerCase().replace(/\s+/g, '');
function filterStock() {
  const box = app.querySelector('input[data-search]');
  if (!box) return;
  const q = searchKey(box.value);
  let shown = 0;
  for (const sec of app.querySelectorAll('.stock-sec')) {
    let n = 0;
    for (const li of sec.querySelectorAll('li.s-item')) {
      const hit = !q || li.dataset.find.includes(q);
      li.hidden = !hit;
      if (hit) n++;
    }
    sec.hidden = !n;
    sec.querySelector('h2 .n').textContent = n; // Anzahl der gefundenen / 찾은 개수
    shown += n;
  }
  app.querySelector('#no-match').hidden = shown > 0;
  app.querySelector('[data-clear-search]').hidden = !box.value;
}

// ---------- Aktionen / 동작 ----------
let openId = null; // aufgeklappter Artikel in "Gekauft" / 구입한 것에서 펼친 물건
let noteId = null; // Artikel, dessen Notiz gerade bearbeitet wird / 메모를 고치는 중인 항목
const noteHtml = x => x.note ? ` <span class="note">${esc(x.note)}</span>` : '';
let moveId = null; // Artikel, für den gerade die Zielliste gewählt wird / 옮길 목록을 고르는 중인 항목
const actions = {
  open(v) { openId = openId === v ? null : v; },
  moveOpen(v) { moveId = moveId === v ? null : v; noteId = null; },
  noteOpen(v) { noteId = noteId === v ? null : v; moveId = null; },
  move(v) {
    const [id, store] = v.split(':'), i = S.items.find(i => i.id === id);
    if (i) i.store = store;
    moveId = null;
  },
  lang(v) { S.lang = v; },
  tab(v) { S.active = v; },
  addStore() {
    const name = (prompt(t().newStore) || '').trim();
    if (!name) return;
    const s = { id: uid(), name };
    S.stores.push(s); S.active = s.id;
  },
  delStore() {
    const s = S.stores.find(s => s.id === S.active);
    if (!s || !confirm(t().delStoreQ(storeName(s)))) return;
    S.stores = S.stores.filter(x => x !== s);
    S.items = S.items.filter(i => i.store !== s.id);
  },
  del(v) { S.items = S.items.filter(i => i.id !== v); },
  buy(v) {
    const i = S.items.find(i => i.id === v);
    if (!i) return;
    S.items = S.items.filter(x => x !== i);
    const bought = iso(new Date()), days = guessDays(i.name) || guessDays(tr(i.name, 'de')) || guessDays(tr(i.name, 'ko'));
    // Lag es zuletzt im Vorrat? Dann gleich wieder dorthin. / 지난번에 실온에 뒀으면 바로 실온으로.
    const m = S.memo.find(m => m.id === memoId(i.name));
    const x = { id: i.id, name: i.name, ...(i.note && { note: i.note }), store: i.store, loc: m && m.loc === 'pantry' ? 'pantry' : null, bought, days, expires: null };
    if (days) x.expires = addDays(bought, shelfDays(x));
    S.stock.push(x);
  },
  // Lagerort wählen; ein selbst eingetragenes Datum bleibt, ein geschätztes wird neu berechnet.
  // 보관 장소 선택. 직접 입력한 날짜는 그대로 두고, 자동 계산한 날짜만 다시 계산.
  loc(v) {
    const [id, loc] = v.split(':');
    const x = S.stock.find(x => x.id === id);
    if (!x) return;
    x.loc = loc;
    // Nur "Vorrat" wird gemerkt; Kühlschrank und Gefrierfach wählt man jedes Mal neu.
    // 실온만 기억. 냉장고·냉동고는 매번 직접 고름.
    const key = memoId(x.name);
    S.memo = S.memo.filter(m => m.id !== key);
    if (loc === 'pantry') S.memo.push({ id: key, loc });
    if (!x.manual && x.days) { x.expires = addDays(x.bought, shelfDays(x)); }
  },
  exp(v, el) {
    const x = S.stock.find(x => x.id === v);
    if (x) { x.expires = el.value || null; x.manual = true; }
  },
  again(v) {
    const x = S.stock.find(x => x.id === v);
    if (!x) return;
    const store = S.stores.some(s => s.id === x.store) ? x.store : (S.stores[0] || {}).id;
    if (store && !S.items.some(i => i.store === store && i.name === x.name)) S.items.push({ id: uid(), store, name: x.name, ...(x.note && { note: x.note }) });
    S.stock = S.stock.filter(y => y !== x);
  },
  used(v) { S.stock = S.stock.filter(x => x.id !== v); },
  notif() { Notification.requestPermission().then(() => { render(); checkExpiry(); }); return false; },
  signin() { cloud.signIn().catch(cloudErr); return false; },
  signout() { cloud.signOut().catch(cloudErr); return false; },
  houseNew() { cloud.create().catch(cloudErr); return false; },
  houseJoin() {
    const code = (prompt(t().joinPrompt) || '').trim();
    if (code) cloud.join(code).then(ok => { if (!ok) alert(t().badCode); }).catch(cloudErr);
    return false;
  },
  copyCode(v, el) {
    if (navigator.clipboard) navigator.clipboard.writeText(S.house).then(() => { el.textContent = '✓'; }).catch(() => {});
    return false;
  },
};
const cloudErr = e => alert(t().cloudErr + '\n' + (e && (e.code || e.message) || ''));

function run(act, v, el) {
  if (!actions[act]) return;
  if (actions[act](v, el) === false) return;
  save(); render(); checkExpiry();
  if (act === 'noteOpen' && noteId) app.querySelector('form[data-act=note] input').focus();
}
const app = document.getElementById('app');
app.addEventListener('input', e => { if (e.target.matches('input[data-search]')) filterStock(); });
app.addEventListener('click', e => {
  if (e.target.closest('[data-clear-search]')) {
    const box = app.querySelector('input[data-search]');
    box.value = '';
    filterStock();
    box.focus();
    return;
  }
  const el = e.target.closest('button[data-act]');
  if (el) run(el.dataset.act, el.dataset.v, el);
});
app.addEventListener('change', e => {
  const el = e.target.closest('input[data-act]');
  if (!el) return;
  // Kurz abgehakt zeigen, dann nach "Gekauft" verschieben / 체크 표시를 잠깐 보여 준 뒤 이동
  if (el.dataset.act === 'buy') setTimeout(() => run('buy', el.dataset.v, el), 220);
  else run(el.dataset.act, el.dataset.v, el);
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.act === 'note') {
    const id = e.target.dataset.v, i = [...S.items, ...S.stock].find(i => i.id === id), note = e.target.elements['note_' + id].value.trim();
    if (i && note) i.note = note; else if (i) delete i.note;
    if (i) {
      // Geänderte Übersetzung merken; ein geleertes Feld holt die automatische zurück.
      // 고친 번역을 기억. 칸을 비우면 자동 번역으로 돌아감.
      const n = clean(i.name), to = srcLang(n) === 'ko' ? 'de' : 'ko', was = tr(n, to), t = clean(e.target.elements['tx_' + id].value);
      if (t !== (was !== n ? was : '')) {
        S.fix = S.fix.filter(f => f.id !== fixId(n));
        if (t) S.fix.push({ id: fixId(n), to: t });
      }
    }
    noteId = null;
    save(); render();
    return;
  }
  const name = e.target.elements.name.value.trim();
  if (!name) return;
  S.items.push({ id: uid(), store: S.active, name });
  e.target.elements.name.value = '';
  save(); render();
  app.querySelector('.add input').focus();
});

// ---------- Erinnerungen / 알림 ----------
function notify(title, body, tag) {
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller)
      navigator.serviceWorker.ready.then(r => r.showNotification(title, { body, tag, icon: 'icon.svg' }));
    else new Notification(title, { body, tag });
  } catch (e) {}
}
// Einmal pro Artikel melden, sobald die Vorwarnzeit erreicht ist / 알림 시점이 되면 물건마다 한 번 알림
function checkExpiry() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  // Pro Gerät merken (nicht geteilt), für welches Datum schon gemeldet wurde – so klingeln beide Handys.
  // 어느 날짜에 대해 알렸는지 기기마다 따로 기억(공유 안 함) — 두 휴대폰 모두 울리도록.
  const seen = S.seen = S.seen || {};
  let changed = false;
  for (const id in seen) if (!S.stock.some(x => x.id === id)) { delete seen[id]; changed = true; }
  for (const x of S.stock) {
    if (seen[x.id] === x.expires || !soon(x)) continue;
    notify(t().nTitle, t().nBody(tr(x.name), daysLeft(x.expires)), x.id);
    seen[x.id] = x.expires; changed = true;
  }
  if (changed) try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

render();
checkExpiry();
setInterval(() => { render(); checkExpiry(); }, 60 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); checkExpiry(); } });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<script src="firebase-config.js"></script>
<script type="module">
// ---------- Konto & gemeinsame Liste (Firebase) / 계정과 공유 목록 ----------
// Ein Haushalt ist ein Dokument households/{Einladungscode} mit den Karten stores, items, stock (je id → Eintrag).
// Jede Änderung geht als einzelnes Feld hoch, damit zwei Handys sich nicht gegenseitig überschreiben.
// 한 집 = households/{초대 코드} 문서 하나, 그 안에 stores·items·stock 맵(id → 항목).
// 바뀐 항목만 필드 단위로 올려서 두 휴대폰이 서로 덮어쓰지 않게 함.
const cfg = window.FIREBASE_CONFIG;
if (cfg) {
  const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{ initializeApp }, A, F] = await Promise.all(
    [import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-firestore.js')]);
  const fb = initializeApp(cfg), auth = A.getAuth(fb);
  const db = F.initializeFirestore(fb, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });

  const KINDS = ['stores', 'items', 'stock', 'memo', 'fix'], FIRST = ['super', 'asia', 'online'];
  const sig = o => JSON.stringify(o, Object.keys(o).sort());
  const rank = s => (FIRST.indexOf(s.id) + 1) || 9;
  const house = () => F.doc(db, 'households', S.house);
  let unsub = null, first = true;

  // Unterschied zwischen dem zuletzt gesehenen Serverstand (S.remote) und dem Gerät, als Feld-Updates.
  // 마지막으로 본 서버 상태(S.remote)와 기기 상태의 차이를 필드 업데이트로.
  function changes() {
    const out = {};
    for (const k of KINDS) {
      const base = (S.remote && S.remote[k]) || {}, local = Object.fromEntries(S[k].map(x => [x.id, x]));
      for (const id in local) if (!base[id] || sig(local[id]) !== sig(base[id])) out[`${k}.${id}`] = local[id];
      for (const id in base) if (!local[id]) out[`${k}.${id}`] = F.deleteField();
    }
    return out;
  }
  function push() {
    if (!unsub || first || !S.house) return;
    const c = changes();
    if (Object.keys(c).length) F.updateDoc(house(), c).catch(e => console.warn('sync', e));
  }
  function listen() {
    stop(); first = true;
    unsub = F.onSnapshot(house(), snap => {
      if (!snap.exists()) return;
      if (first) {
        // Erst hochladen, was auf diesem Gerät seit dem letzten Abgleich dazukam; die Antwort enthält es dann.
        // 마지막 동기화 뒤 이 기기에서 바뀐 것을 먼저 올림. 다음 응답에 그 내용이 포함됨.
        first = false;
        const c = changes();
        if (Object.keys(c).length) { F.updateDoc(house(), c).catch(e => console.warn('sync', e)); return; }
      }
      const d = snap.data();
      S.remote = JSON.parse(JSON.stringify(Object.fromEntries(KINDS.map(k => [k, d[k] || {}]))));
      const list = k => Object.values(JSON.parse(JSON.stringify(S.remote[k]))).sort((a, b) => a.id < b.id ? -1 : 1);
      S.stores = list('stores').sort((a, b) => rank(a) - rank(b));
      S.items = list('items'); S.stock = list('stock'); S.memo = list('memo'); S.fix = list('fix');
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      render(); checkExpiry();
    }, e => console.warn('sync', e));
  }
  function stop() { if (unsub) unsub(); unsub = null; }
  async function link(code) {
    S.house = code; S.remote = null; save();
    await F.setDoc(F.doc(db, 'users', auth.currentUser.uid), { house: code });
    listen(); render();
  }

  window.cloud = {
    ready: false, user: null, push,
    signIn: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
    async signOut() { stop(); delete S.house; delete S.remote; save(); await A.signOut(auth); },
    async create() {
      const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const code = [...crypto.getRandomValues(new Uint8Array(10))].map(n => abc[n % abc.length]).join('');
      await F.setDoc(F.doc(db, 'households', code), { stores: {}, items: {}, stock: {}, created: Date.now() });
      await link(code);
    },
    async join(code) {
      code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!code || !(await F.getDoc(F.doc(db, 'households', code))).exists()) return false;
      await link(code);
      return true;
    },
  };

  A.onAuthStateChanged(auth, async user => {
    cloud.user = user;
    if (!user) stop();
    else {
      if (!S.house) try {
        const u = await F.getDoc(F.doc(db, 'users', user.uid));
        if (u.exists() && u.data().house) { S.house = u.data().house; S.remote = null; save(); }
      } catch (e) { console.warn('sync', e); }
      if (S.house && !unsub) listen();
    }
    cloud.ready = true;
    render();
  });
}
</script>
